services:
  contrail:
    build:
      context: .
      dockerfile: Dockerfile
    image: contrail:latest
    container_name: contrail-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - API_BASE_URL=${API_BASE_URL:-https://airline.api.veyino.org}
      - DB_PATH=/app/data/contrail.db
      - POLLER_ENABLED=${POLLER_ENABLED:-true}
      - UPSTREAM_PROVIDER=${UPSTREAM_PROVIDER:-auto}
      - ADSB_FI_SNAPSHOT_URL=${ADSB_FI_SNAPSHOT_URL:-https://opendata.adsb.fi/api/v2/snapshot}
      - ADSB_FI_POLL_INTERVAL_SEC=${ADSB_FI_POLL_INTERVAL_SEC:-35}
      - OPENSKY_URL=${OPENSKY_URL:-https://opensky-network.org/api/states/all}
      - OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID:-}
      - OPENSKY_CLIENT_SECRET=${OPENSKY_CLIENT_SECRET:-}
      - OPENSKY_IS_FEEDER=${OPENSKY_IS_FEEDER:-false}
      - OPENSKY_POLL_INTERVAL_SEC=${OPENSKY_POLL_INTERVAL_SEC:-90}
      - OPENSKY_BOUNDING_BOX=${OPENSKY_BOUNDING_BOX:-}
      - ADS_B_DB_BASE_URL=${ADS_B_DB_BASE_URL:-https://api.adsbdb.com/v0/callsign/}
      - ADS_B_DB_RATE_LIMIT_PER_MIN=${ADS_B_DB_RATE_LIMIT_PER_MIN:-400}
      - CALLSIGN_CACHE_TTL_HOURS=${CALLSIGN_CACHE_TTL_HOURS:-24}
      - RETENTION_DAYS=${RETENTION_DAYS:-90}
      - RETENTION_CLEANUP_INTERVAL_MIN=${RETENTION_CLEANUP_INTERVAL_MIN:-60}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
